<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Daily Phrases</title>
  <style>
    :root {
      --primary: #1cb0f6;
      --primary-dark: #1899d6;
      --bg: #f7f9fa;
      --card-bg: #ffffff;
      --border-color: #e5e5e5;
      --text: #2b2b2b;
      --text-muted: #777777;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    
    .card { 
      background: var(--card-bg); 
      width: 100%; 
      max-width: 450px; 
      border-radius: 20px; 
      padding: 24px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.06); 
      border: 2px solid var(--border-color); 
    }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 12px; }
    .title { font-size: 1.1rem; color: var(--primary-dark); font-weight: bold; }
    .progress-tag { background: #f0f2f5; padding: 6px 12px; border-radius: 16px; font-size: 0.85rem; color: var(--text-muted); font-weight: bold; }
    
    .phrase-container { margin: 25px 0; text-align: center; }
    .english-text { font-size: 1.5rem; font-weight: 700; color: #111; margin-bottom: 12px; line-height: 1.3; }
    .translation-text { font-size: 1.15rem; color: #555; font-weight: 500; background: #f0f8ff; padding: 12px; border-radius: 12px; border: 1px solid #d0e8ff; }

    .action-btn { 
      width: 100%; 
      background: var(--primary); 
      color: white; 
      border: none; 
      padding: 16px; 
      border-radius: 14px; 
      font-size: 1.1rem; 
      font-weight: bold; 
      cursor: pointer; 
      box-shadow: 0 4px 0 var(--primary-dark); 
      transition: transform 0.1s;
    }
    .action-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--primary-dark); }

    .end-screen { text-align: center; padding: 20px 0; }
    .end-title { font-size: 1.5rem; font-weight: bold; color: var(--primary-dark); margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <span class="title">Frases do Dia 📖</span>
    <span id="progress-indicator" class="progress-tag">1 / 7</span>
  </div>

  <!-- TELA DA FRASE -->
  <div id="phrase-view">
    <div class="phrase-container">
      <div class="english-text" id="en-phrase">Carregando...</div>
      <div class="translation-text" id="pt-translation">...</div>
    </div>
    <button id="next-btn" class="action-btn" onclick="proximaFrase()">PRÓXIMA FRASE</button>
  </div>

  <!-- TELA FINAL -->
  <div id="end-view" class="end-screen" style="display: none;">
    <div class="end-title">Estudo Concluído! 🎉</div>
    <p style="color: #666; margin-bottom: 20px;">Você revisou as frases de hoje com sucesso.</p>
    <button class="action-btn" onclick="iniciarSessao()">VER OUTRAS FRASES</button>
  </div>
</div>

<script>
  // Mantém o link do seu arquivo perguntas.json no GitHub
  const URL_BANCO_GITHUB = "https://raw.githubusercontent.com/bm545095-afk/02INGLES/refs/heads/main/perguntas.json";

  const TOTAL_POR_SESSAO = 7;
  let bancoCompleto = [];
  let frasesSessao = [];
  let indiceAtual = 0;

  async function carregarBanco() {
    try {
      const res = await fetch(URL_BANCO_GITHUB);
      bancoCompleto = await res.json();
      iniciarSessao();
    } catch (e) {
      document.getElementById('en-phrase').innerText = "Erro ao carregar o banco de frases.";
    }
  }

  function iniciarSessao() {
    if (!bancoCompleto || bancoCompleto.length === 0) return;

    // Sorteia 7 frases do seu banco
    frasesSessao = [...bancoCompleto]
      .sort(() => Math.random() - 0.5)
      .slice(0, TOTAL_POR_SESSAO);

    indiceAtual = 0;
    document.getElementById('phrase-view').style.display = 'block';
    document.getElementById('end-view').style.display = 'none';

    exibirFrase();
  }

  function exibirFrase() {
    const item = frasesSessao[indiceAtual];
    
    // Suporta o campo frase_ingles ou pergunta
    document.getElementById('en-phrase').innerText = item.frase_ingles || item.pergunta;
    document.getElementById('pt-translation').innerText = item.traducao;

    document.getElementById('progress-indicator').innerText = `${indiceAtual + 1} / ${TOTAL_POR_SESSAO}`;
    
    const btn = document.getElementById('next-btn');
    btn.innerText = (indiceAtual + 1 < TOTAL_POR_SESSAO) ? "PRÓXIMA FRASE" : "CONCLUIR ESTUDO";
  }

  function proximaFrase() {
    indiceAtual++;
    if (indiceAtual < TOTAL_POR_SESSAO) {
      exibirFrase();
    } else {
      document.getElementById('phrase-view').style.display = 'none';
      document.getElementById('end-view').style.display = 'block';
      document.getElementById('progress-indicator').innerText = "Fim!";
    }
  }

  window.onload = carregarBanco;
</script>
</body>
</html>
